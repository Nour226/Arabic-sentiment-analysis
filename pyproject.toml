[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-sentiment"
version = "0.1.0"
description = "Production MLOps Service for Arabic Sentiment Analysis"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "onnxruntime>=1.17.0",
    "python-json-logger>=2.0.7",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "pre-commit>=3.6.0",
    "dvc>=3.60.0"
]
ml = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "datasets>=2.18.0",
    "accelerate>=0.26.0",
    "mlflow>=2.11.0",
    "boto3>=1.34.0",
    "tf2onnx>=1.16.0"
]
data = ["kagglehub>=0.3.0"]
serving = ["bentoml>=1.4,<2", "pyarrow>=18.0.0"]
loadtest = ["locust>=2.32.0"]
optimization = ["onnx>=1.16.0"]

[project.scripts]
arabic-sentiment-train = "arabic_sentiment.train:main"
arabic-sentiment-serve = "arabic_sentiment.api.main:run"
arabic-sentiment-batch = "arabic_sentiment.batch:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/arabic_sentiment --cov-report=term-missing"
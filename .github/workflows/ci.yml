name: CI/CD Pipeline

on:
  push:
    branches: [ main, "module-*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check src tests

      - name: Run Pytest with Coverage Gate
        run: |
          pytest -v --cov=src/arabic_sentiment --cov-fail-under=80

      - name: Validate DVC pipeline
        run: dvc dag

      - name: Validate Docker Compose
        run: docker compose -f docker/docker-compose.yml config -q

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -f docker/Dockerfile -t arabic-sentiment:test .
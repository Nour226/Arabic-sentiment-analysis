name: CI/CD Pipeline

on:
  push:
    branches: [ main, "module-*" ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,serving]"

      - name: Lint with Ruff
        run: |
          ruff check src tests serving loadtest optimization monitoring scripts

      - name: Run Pytest with Coverage Gate
        run: |
          pytest -v --cov=src/arabic_sentiment --cov-fail-under=80

      - name: Run model quality gate when metrics are available
        if: ${{ hashFiles('reports/training-metrics.json') != '' }}
        run: python scripts/check_quality.py --metrics reports/training-metrics.json --baseline 0.70

      - name: Validate DVC pipeline
        run: dvc dag

      - name: Validate Docker Compose
        run: docker compose -f docker/docker-compose.yml config -q

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -f docker/Dockerfile -t arabic-sentiment:test .

  docker-publish:
    needs: docker-build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/arabic-sentiment:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/arabic-sentiment:${{ github.sha }}
